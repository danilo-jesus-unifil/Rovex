[package]
name = "rovex"
version = "0.1.6"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Explorador de arquivos local, seguro e leve para Windows 10/11"
repository = "https://github.com/danilo-jesus-unifil/Rovex"
readme = "README.md"
build = "build.rs"

[target.'cfg(target_os = "linux")'.dependencies]
# O CI Linux e os smoke tests usam Xvfb/X11; Wayland não é compilado nesse alvo.
slint = { version = "=1.17.1", default-features = false, features = ["backend-winit-x11", "renderer-software", "accessibility", "compat-1-2"] }

[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
# Preserve o backend completo para Unix não-Linux, sem restringir plataformas não testadas.
slint = { version = "=1.17.1", default-features = false, features = ["backend-winit", "renderer-software", "accessibility", "compat-1-2"] }

[target.'cfg(windows)'.dependencies]
# Windows 10/11 continua com X11/Wayland desativados pelo próprio target e backend Winit nativo.
slint = { version = "=1.17.1", default-features = false, features = ["backend-winit", "renderer-software", "accessibility", "compat-1-2"] }
# SHGetKnownFolderPath oferece os caminhos redirecionados pelo Windows sem depender de nomes localizados.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Environment", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[build-dependencies]
slint-build = "=1.17.1"

[lib]
name = "rovex_core"
path = "src/lib.rs"

[[bin]]
name = "rovex"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "abort"

[workspace]
members = ["."]
resolver = "2"
