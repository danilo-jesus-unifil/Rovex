name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Install Linux UI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libfontconfig1-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --all-targets --all-features

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Activation contract
        shell: bash
        run: ./scripts/test_activation_contract.sh

      - name: Windows native smoke contract
        shell: bash
        run: ./scripts/test_windows_native_contract.sh

      - name: Reserved Windows names contract
        shell: bash
        run: ./scripts/test_reserved_windows_names_contract.sh

      - name: FFmpeg discovery contract
        shell: bash
        run: ./scripts/test_ffmpeg_discovery_contract.sh

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Native Windows CLI smoke
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/verify_windows_native.ps1

  windows-gnu-cross-build:
    name: Windows GNU cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Build Windows GNU release
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Package and verify portable metadata
        shell: bash
        run: |
          rm -rf dist
          scripts/package_windows_portable.sh x86_64-pc-windows-gnu dist
          archive="$(find dist -maxdepth 1 -type f -name '*.zip' -print -quit)"
          scripts/test_verify_windows_portable.sh "$archive"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Audit RustSec advisories
        run: cargo audit

      - name: Check licenses and bans
        run: cargo deny check

  documentation:
    name: Documentation layout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Markdown layout and links
        run: python3 scripts/verify_markdown_layout.py

      - name: Test Markdown validator
        run: python3 -m unittest scripts/test_verify_markdown_layout.py -v
